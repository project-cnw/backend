plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// ===== Spring Boot 핵심 기능 =====
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'    // JPA, Hibernate, Repository 패턴
	implementation 'org.springframework.boot:spring-boot-starter-web'          // Spring MVC, 내장 Tomcat, JSON 처리
	implementation 'org.springframework.boot:spring-boot-starter-security'     // 인증, 인가, 보안 필터
	implementation 'org.springframework.boot:spring-boot-starter-mail'         // 이메일 발송 (SMTP)
	implementation 'org.springframework.boot:spring-boot-starter-validation'   // Bean Validation (@Valid, @NotNull 등)

	// ===== JWT 인증 라이브러리 =====
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'        // JWT API 인터페이스
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'          // JWT 구현체
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'       // JWT JSON 처리

	// ===== API 문서화 =====
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'  // Swagger UI, OpenAPI 3.0

	// ===== 코드 자동 생성 =====
	compileOnly 'org.projectlombok:lombok'                   // @Getter, @Setter, @Data 등
	annotationProcessor 'org.projectlombok:lombok'           // 컴파일 타임 어노테이션 처리

	// ===== 데이터베이스 드라이버 =====
	runtimeOnly 'com.h2database:h2'                          // 인메모리 DB (개발/테스트용)
	runtimeOnly 'com.mysql:mysql-connector-j'                // MySQL 드라이버 (운영용)

	// ===== 테스트 프레임워크 =====
	testImplementation 'org.springframework.boot:spring-boot-starter-test'    // JUnit 5, Mockito, AssertJ
	testImplementation 'org.springframework.security:spring-security-test'    // Spring Security 테스트 지원
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'             // JUnit 플랫폼 런처
}

tasks.named('test') {
	useJUnitPlatform()
}